[bar/top]
width = 100%
height = 32
monitor = ${env:MONITOR:}
background = #292828
foreground = #C0AF8B
font-0 = Iosevka Nerd Font:size=11;1
; Modules are ordered to mirror Waybar: left, center, right
modules-left = launcher dwm-tags dwm-title
modules-center = media
modules-right = updates cpu memory vpn network hotspot speed audio mic battery clock tray power

; ----- Left
[module/launcher]
type = custom/script
exec = echo ""
click-left = $HOME/fjordwm/rofi/runner/runner.sh

[module/dwm-tags]
type = internal/dwm
label-focused = %name%
label-unfocused = %name%
label-empty = %name%

[module/dwm-title]
type = internal/dwm
format = %title%

; ----- Center
[module/media]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/media-wrapper.sh
interval = 1

; ----- Right
[module/updates]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/updates-wrapper.sh
interval = 60

[module/cpu]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/cpu-wrapper.sh
interval = 5

[module/memory]
type = internal/memory
format = " %percentage%%"

[module/vpn]
type = custom/script
exec = $HOME/fjordwm/waybar/bin/vpn
interval = 5

[module/network]
type = internal/network
; interface can be overridden via env: NETWORK_IFACE
interface = ${env:NETWORK_IFACE:}
format-connected = "{ifname} {ipaddr}"
format-disconnected = "󰖪"

[module/hotspot]
type = custom/script
exec = $HOME/fjordwm/waybar/bin/hotspot
interval = 5

[module/speed]
type = custom/script
exec = $HOME/fjordwm/waybar/bin/network_speed.sh
interval = 5

[module/audio]
type = internal/pulseaudio
format = "{icon} {volume}%"
format-muted = "󰖁 mute"
; left-click opens pavucontrol
click-right = pavucontrol

[module/mic]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/mic-wrapper.sh
interval = 2

[module/battery]
type = internal/battery
battery = BAT0
format-charging = "󰂄 %percentage%%"
format = "{icon} %percentage%%"

[module/clock]
type = internal/date
interval = 1
format = "󰥔 %a %d %b %H:%M:%S"

[module/tray]
type = internal/tray

[module/power]
type = custom/script
exec = echo "⏻"
click-left = $HOME/fjordwm/rofi/powermenu/powermenu.sh
