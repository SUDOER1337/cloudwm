[bar/top]
width = 100%
height = 32
monitor = ${env:MONITOR:}
background = #292828
foreground = #C0AF8B
font-0 = Iosevka Nerd Font:size=11;1
; Modules are ordered to mirror Waybar: left, center, right
modules-left = launcher,dwm-tags,dwm-title
modules-center = media
modules-right = updates,cpu,memory,vpn,network,hotspot,speed,audio,mic,battery,clock,tray,power

; Example module definitions (fill with concrete implementations below)
[module/launcher]
type = custom/script
exec = echo ""
click-left = $HOME/fjordwm/rofi/runner/runner.sh

[module/dwm-tags]
type = internal/dwm
label-focused = %name%
label-unfocused = %name%
label-empty = %name%

[module/dwm-title]
type = internal/dwm
format = %title%

[module/media]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/media-wrapper.sh
interval = 1

[module/updates]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/updates-wrapper.sh
interval = 60

[module/cpu]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/cpu-wrapper.sh
interval = 5

[module/mic]
type = custom/script
exec = $HOME/fjordwm/polybar/wrappers/mic-wrapper.sh
interval = 2

[module/tray]
type = internal/tray
