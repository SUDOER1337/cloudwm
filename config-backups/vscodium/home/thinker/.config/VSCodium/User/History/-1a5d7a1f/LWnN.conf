# Format:
# app_name=path1 path2 path3

kitty=$HOME/.config/kitty
nemo=$HOME/.config/nemo
thunar=$HOME/.config/thunar

picom=$HOME/.config/picom
redshift=$HOME/.config/redshift
fish=$HOME/.config/fish $HOME/.local/share/fish
nvim=$HOME/.config/nvim $HOME/.local/share/nvim
ardour8=$HOME/.config/ardour8 $HOME/.local/share/ardour8
godot=$HOME/.config/godot $HOME/.local/share/godot

vscodium=\
$HOME/.config/VSCodium \
$HOME/.vscode-oss \
$HOME/.local/share/VSCodium \
$HOME/.cache/VSCodium

# Optional
git=$HOME/.gitconfig
zsh=$HOME/.zshrc $HOME/.oh-my-zsh

