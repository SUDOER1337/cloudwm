backend = "glx";

#################################
# Opacity
#################################

# inactive-opacity = 0.9;
# active-opacity = 0.9;
# frame-opacity = 0.8;
# inactive-opacity-override = false;

#################################
# Fading
#################################

# Fade windows in/out when opening/closing and when opacity changes,
# unless no-fading-openclose is used.
fading = false;

# Opacity change between steps while fading in. (0.01 - 1.0, defaults to 0.028)
fade-in-step = 0.05;

# Opacity change between steps while fading out. (0.01 - 1.0, defaults to 0.03)
fade-out-step = 0.05;

# The time between steps in fade step, in milliseconds. (> 0, defaults to 10)
fade-delta = 5;

# Specify a list of conditions of windows that should not be faded.
# fade-exclude = [];

# Do not fade on window open/close.
# no-fading-openclose = false;

# Do not fade destroyed ARGB windows with WM frame. Workaround of bugs in Openbox, Fluxbox, etc.
# no-fading-destroyed-argb = false;

#################################
# Shadows
#################################

# Enabled client-side shadows on windows.
shadow = true;

# Tuned shadow values: less heavy and less detached.
shadow-radius = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.72;
shadow-color = "#000000";

# Crop shadows per-monitor on multihead.
xinerama-shadow-crop = true;

# The shadow exclude options are helpful if you have shadows enabled.
shadow-exclude = [
  "class_g = 'conky'",
  "class_g = 'Peek'",
  "class_g = 'Pensela'",
  "name = 'Drawing Board'",
  "window_type = 'dock'",
  "window_type = 'dropdown_menu'",
  "window_type = 'combo'",
  "window_type = 'popup_menu'",
  "window_type = 'utility'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'eww'",
  "name = 'Notification'",
  "name = 'Plank'",
  "name = 'Docky'",
  "name = 'Kupfer'",
  "name = 'Pensela'",
  "name = 'Drawing Board'",
  # Workaround for VirtualBox empty window at launching
  "name = 'VirtualBox'",
  "name = 'VirtualBoxVM'",
  # Avoid shadow in Negatron popups
  "name = 'Negatron v0.100.1' && argb",
  # Avoid shadow for the XFCE alt tab TaskSwitcher
  "name ?= 'xfwm4' && argb",
  "class_g = 'Conky'",
  "class_g = 'Kupfer'",
  "class_g = 'Synapse'",
  "class_g ?= 'Notify-osd'",
  "class_g ?= 'Cairo-dock'",
  "class_g = 'Cairo-clock'",
  "class_g ?= 'Xfce4-notifyd'",
  # Exclude special Firefox/Firefox-esr/Thunderbird dropdowns.
  # Ref: https://github.com/chjj/compton/issues/247
  "class_g = 'Thunderbird' && argb",
  "class_g = 'Telegram' && argb",
  "name ?= 'Thunderbird' && (window_type = 'utility' || window_type = 'popup_menu')",
  # Exclude some special popup menu shadows, but modal windows.
  "class_g ?= 'Thunderbird' && class_i = 'Popup' && argb",
  "class_g = 'firefox' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
  "class_g = 'Firefox' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
  "class_g = 'firefox-esr' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
  "class_g = 'Firefox-esr' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
  "class_g = 'Tor Browser' && (window_type = 'utility') && argb",
  "class_g = 'Navegador Tor' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
  "class_g = 'Thunderbird' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
  "class_g = 'Mozilla Thunderbird' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
  # Exclude Vokoscreen and VokoscreenNG area selector
  "class_g = 'Rofi'",
  "class_g ?= 'vokoscreen' && argb",
  "name = 'Área'",
  "name *= 'Cuenta regresiva'",
  "_NET_WM_WINDOW_TYPE:a *= '_KDE_NET_WM_WINDOW_TYPE_OVERRIDE'",
  # Avoid artifacts on non-rounded shaped windows.
  "bounding_shaped && !rounded_corners"
];

# Avoid drawing shadow on all shaped windows.
# Deprecated, use shadow-exclude with bounding_shaped expressions.
shadow-ignore-shaped = false;

#################################
# Rounded Corner
#################################

corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'"
];

# sw-opti = true;
# unredir-if-possible = true;
# unredir-if-possible-delay = 5000;
# unredir-if-possible-exclude = [];

focus-exclude = [ "class_g = 'Cairo-clock'" ];

detect-transient = true;
detect-client-leader = true;
invert-color-include = [];

resize-damage = 2;

#################################
# Blur
#################################

blur-background = true;
blur-method = "dual_kawase";
blur-size = 50;
# blur-deviation = 5.0;

# Blur background of opaque windows with transparent frames as well.
# blur-background-frame = true;

# Do not let blur radius adjust based on window opacity.
# blur-background-fixed = true;

# blur-kern = "3x3box";
# blur-kern = "5x5box";
# blur-kern = "5x5gaussian";
# blur-kern = "9x9gaussian";

blur-background-exclude = [
  "class_g = 'conky'",
  "class_g = 'Peek'",
  "class_g = 'Pensela'",
  "name = 'Drawing Board'",
  "window_type = 'dock'",
  "window_type = 'dropdown_menu'",
  "window_type = 'combo'",
  "window_type = 'popup_menu'",
  "window_type = 'utility'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

opacity-exclude = [
  "name = 'Stratagus'"
];
