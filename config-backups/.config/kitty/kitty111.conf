# Fonts
font_family             JetBrainsMono NF Bold
bold_font               JetBrainsMono NF ExtraBold
italic_font             JetBrainsMono NF Italic
bold_italic_font        JetBrainsMono NF ExtraBold Italic
font_size               10

allow_remote_control yes

# Shell
shell /usr/bin/fish
shell_integration no-cursor

window_padding_width 25
close_on_child_death yes

cursor_shape_unfocused beam
cursor_blink_interval 0.5 ease-in-out

cursor_trail 1
enable_audio_bell no
confirm_os_window_close 0

# ------------------------
# Appearance — Apricity
# ------------------------

# Primary
background              #292828
foreground              #D8DEE9

# Cursor (sunlight glow)
cursor                  #EBCB8B
cursor_text_color       #2F3746

# Selection (misty overlay)
selection_background    #3B4252
selection_foreground    #ECEFF4

# Transparency
background_opacity      1


# ------------------------
# ANSI Colors (0–7)
# ------------------------

color0   #2B313D   
color1   #BF616A  
color2   #8FBC8F  
color3   #D7BA7D  
color4   #5E81AC  
color5   #B48EAD   
color6   #88C0D0  
color7   #C8D0DD   

