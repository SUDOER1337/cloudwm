bind_to_address "127.0.0.1"
port "6600"

auto_update "yes"
restore_paused "yes"

music_directory "/mnt/Storages/Audio/"
playlist_directory "~/.config/mpd/playlists"
db_file "~/.config/mpd/mpd.db"
log_file "syslog"
pid_file "/tmp/mpd.pid"
state_file "~/.config/mpd/mpd.state"

audio_output {
    type        "pulse"
    name        "PipeWire Pulse"
    mixer_type  "software"
}

audio_output {
    type        "fifo"
    name        "rmpc-cava"
    path        "/tmp/mpd.fifo"
    format      "44100:16:2"
}
